# Vhost nginx hôte pour 6495prod.com — TLS + reverse-proxy vers le conteneur.
# À copier dans /etc/nginx/sites-available/6495prod puis symlink dans sites-enabled.

upstream book_6495prod {
    server 127.0.0.1:8082;
}

server {
    listen 80;
    server_name 6495prod.com www.6495prod.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name 6495prod.com www.6495prod.com;

    ssl_certificate     /etc/letsencrypt/live/6495prod.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/6495prod.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 10M;

    location / {
        proxy_pass http://book_6495prod;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
