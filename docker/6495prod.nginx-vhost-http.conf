# Vhost initial :80 — proxy vers le conteneur. Certbot --nginx ajoutera
# le bloc HTTPS et la redirection automatiquement.

upstream book_6495prod {
    server 127.0.0.1:8082;
}

server {
    listen 80;
    server_name 6495prod.com www.6495prod.com;

    location / {
        proxy_pass http://book_6495prod;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
