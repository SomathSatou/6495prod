name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Évite de lancer deux déploiements en parallèle sur le même vhost.
concurrency:
  group: deploy-6495prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, deploy & restart container
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Vérifie que le site compile avant de toucher au serveur.
      - name: Build check
        run: |
          npm ci
          npm run build

      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/id_ci
          chmod 600 ~/.ssh/id_ci
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_ci -o BatchMode=yes "$VPS_USER@$VPS_HOST" \
            "cd ~/6495prod && ./deploy.sh"
